version: 2
updates:
  # Keeps the commit-SHA pins of every action current (the repository requires SHA pinning).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # No release younger than two days, as for packages (#94).
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
  # The npm ecosystem also covers pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses versions younger than 48 hours (minimumReleaseAge in pnpm-workspace.yaml, #94), so
    # proposing them earlier would only give a failing PR.
    cooldown:
      default-days: 2
    ignore:
      # @types/node must match the Node major pinned in package.json (volta.node); bump both together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
