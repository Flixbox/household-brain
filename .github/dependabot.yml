version: 2
updates:
  # Keeps the commit-SHA pins of every action current (the repository requires SHA pinning).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # No release younger than two days, as for packages (#94).
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
  # Bun's lockfile (bun.lock) and package.json, every workspace included.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Bun refuses versions younger than 48 hours (minimumReleaseAge in bunfig.toml, #94), so
    # proposing them earlier would only give a failing PR.
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
