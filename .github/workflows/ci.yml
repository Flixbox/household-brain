name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job starts read-only; only the deploy job asks for an OIDC token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nx Cloud lets runs without a token only read the shared cache. The read-write token is a secret
    # of the `nx-cache` environment, which only `main` may use: a branch that rewrites this file still
    # can't read it, and fork pull requests get no secrets at all (#60). Elsewhere: no environment.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cache' || '' }}
    env:
      # Every other run gets the read-only token, a repository secret under its own name, so the
      # read-write one can't reach a pull request even if it were stored as a repository secret.
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || secrets.NX_CLOUD_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads volta.node
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Production build has no emulator wiring
        run: |
          if grep -rlE 'e2eSignIn|127\.0\.0\.1:(9099|8080)' apps/web/dist/; then
            echo '::error::The production build contains emulator code'; exit 1
          fi
      - name: Scan history for secrets (gitleaks)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --config .gitleaks.toml --redact --no-banner --verbose .

  e2e:
    name: End-to-end tests on ${{ matrix.project }} (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Nx Cloud cache, as in the checks job: read-write on main only, read-only elsewhere.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nx-cache' || '' }}
    # One runner per device, each with its own emulators: the journeys run one at a time, so
    # splitting by device is what shortens the critical path. The security-rules tests ride along
    # on the desktop runner.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, android-pixel-9, iphone-17]
    # Microsoft's Playwright image already contains the browsers and every system package they need,
    # so nothing is installed per run (installing them was slow and once hung).
    # Its version must equal @playwright/test in package.json; the first step checks that.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
      NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN || secrets.NX_CLOUD_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root on a checkout owned by the runner's user: without this, every git
      # call Nx makes fails with "dubious ownership".
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Playwright image matches @playwright/test
        run: |
          wanted=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          if [ "$wanted" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $wanted but the CI image is $PLAYWRIGHT_IMAGE_VERSION: update container.image in ci.yml"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # reads volta.node; the image's own Node is older
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21' # Firestore emulator
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Cache the Firebase emulator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      # The journeys run as one cached Nx task per device (`playwright`, after the cached `build:e2e`):
      # when nothing they depend on changed (`e2eEnvironment` and the inputs in `nx.json`), the result
      # is replayed, videos included. (The plugin's per-file `e2e-ci` needs Nx Agents, a paid service.)
      - name: Run the tests against the emulators
        timeout-minutes: 8
        env:
          E2E_PROJECT: ${{ matrix.project }}
        run: |
          tests="pnpm exec nx run @household-brain/web:playwright"
          if [ "$E2E_PROJECT" = desktop-chrome ]; then tests="pnpm test:rules && $tests"; fi
          pnpm exec firebase emulators:exec --only auth,firestore --project demo-household-brain "$tests"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      # The recordings `scripts/pr-gif.sh` turns into a pull request's GIF.
      - if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-videos-${{ matrix.project }}
          path: apps/web/test-results/**/*.webm
          retention-days: 7

  # The "Protect main" ruleset requires a check with this name: it passes only when every device did.
  e2e-result:
    name: Security rules and end-to-end tests (Firebase emulators)
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every device passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success

  deploy:
    name: Deploy to Firebase
    needs: [checks, e2e]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Google only accepts tokens from this repository, refs/heads/main and this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install pnpm (version from packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      # Built here from the checked-out commit, never from a cache entry: the remote cache is
      # shared, and production must not depend on what some other run stored in it.
      - run: pnpm build --skip-nx-cache
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - run: pnpm exec firebase deploy --only hosting,firestore:rules,firestore:indexes --non-interactive
